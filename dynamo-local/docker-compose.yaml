services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    user: root
    volumes:
      - dynamodb-data:/data
    networks:
      - microsservicos-net
    

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dynamodb-local-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
    networks:
      - microsservicos-net
    depends_on:
      dynamodb-local:
        condition: service_started


volumes:
  dynamodb-data:

networks:
  microsservicos-net:
    name: app-network
    driver: bridge